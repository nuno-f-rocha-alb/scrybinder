name: Share viewer
# Publishes the static share viewer (share/site) to GitHub Pages. In the repository settings, Pages > Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["share/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: share/site
      - id: deployment
        uses: actions/deploy-pages@v4
